[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "philips-titan"
version = "0.2.0"
description = "Async client for Philips TVs running Titan OS (JointSpace API v6)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# philips_titan.mqtt (optional Titan OS MQTT push) and philips_titan.system (serial/model decoding)
mqtt = ["paho-mqtt>=2.1"]
system = ["cryptography"]
dev = ["pytest", "pytest-cov", "pytest-homeassistant-custom-component", "mypy", "ruff"]

[project.scripts]
titan = "philips_titan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
