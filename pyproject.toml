[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "philips-titan"
version = "0.2.0"
description = "Async client for Philips TVs running Titan OS (JointSpace API v6)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.scripts]
titan = "philips_titan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
