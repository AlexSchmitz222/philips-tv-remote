rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions; the integration uses the standard light/media_player/remote actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: >
      paho-mqtt comes from PyPI. The JointSpace library is developed in src/philips_titan of this
      repository (MIT) and bundled into titan/; publishing it to PyPI is still open.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-conditions:
    status: exempt
    comment: No device conditions.
  docs-triggers:
    status: exempt
    comment: No device triggers.
  entity-event-setup:
    status: done
    comment: Entities are coordinator entities; the optional MQTT listener lives in the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: >
      Auth errors start reauthentication, other errors raise ConfigEntryNotReady. A TV that is
      unreachable is in standby, which is a valid state (shown as off), not a setup failure.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: >
      PARALLEL_UPDATES = 0 everywhere: the client serialises and spaces requests itself, and rapid
      commands must reach the entities concurrently so they can be coalesced.
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is exactly one TV.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One config entry is exactly one TV; removing the entry removes the device.

  # Platinum
  async-dependency:
    status: todo
    comment: >
      JointSpace is async (httpx). The optional MQTT push uses paho-mqtt (thread based, run in the
      executor), as HA's own MQTT integration does.
  inject-websession: done
  strict-typing: done
